name: Build

# Baut die App für jeden PR und führt die Unit-Tests auf einem Simulator aus.
# GoogleService-Info.plist ist nicht im Repo; für den Build reicht ein Platzhalter.
# Der Job-Name bleibt, weil der Branch-Schutz den Check unter diesem Namen verlangt.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    uses: Revisor01/workflows/.github/workflows/xcode-tests.yml@5bb9fc1d9e2cd728029f334f50bbe355f005eef5 # 1.3.1
    with:
      projekt: ntfy-ios.xcodeproj
      schema: ntfy
      aktion: test
      test-ziel: ntfyTests
      # iOS-27-SDK: Xcode 27 gibt es auf GitHub derzeit nur im Image "xcode-27"
      runner: xcode-27
      xcode: vorgabe
      ohne-signierung: true
      vorbereitung: |
        cat > ntfy/GoogleService-Info.plist <<'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>API_KEY</key><string>ci-placeholder</string>
          <key>GCM_SENDER_ID</key><string>000000000000</string>
          <key>BUNDLE_ID</key><string>de.godsapp.ntfy</string>
          <key>PROJECT_ID</key><string>ci-placeholder</string>
          <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
          <key>IS_ADS_ENABLED</key><false/>
          <key>IS_ANALYTICS_ENABLED</key><false/>
          <key>IS_APPINVITE_ENABLED</key><false/>
          <key>IS_GCM_ENABLED</key><true/>
          <key>IS_SIGNIN_ENABLED</key><false/>
        </dict>
        </plist>
        PLIST
      # Aufgelöste Paketversionen, damit Package.resolved ohne lokalen Mac
      # aktualisiert werden kann.
      artefakt: ntfy-ios.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
