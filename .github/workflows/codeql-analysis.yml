name: CodeQL

# Hinweis: Datei heisst codeql-analysis.yml, weil der alte Workflow (codeql.yml)
# von GitHub wegen Inaktivitaet deaktiviert wurde; ein neuer Pfad ist wieder aktiv.
#
# Eigener Workflow statt Default-Setup: dessen Autobuild scheitert an nanopb
# (transitive Firebase-Abhängigkeit). Das Paket enthält eine Datei namens "build",
# wo Xcode ein Verzeichnis anlegen will — "File exists but is not a directory".
# Swift unterstützt build-mode: none nicht, daher ein manueller Build mit
# eigenem DerivedData-Pfad, der die Kollision umgeht.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

jobs:
  analyze:
    name: Analyze Swift
    # Swift-Analyse laeuft nur auf macOS-Runnern; iOS-27-SDK nur im Image "xcode-27"
    runs-on: xcode-27
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Der CodeQL-Tracer fuer Swift ist x86_64 und braucht Rosetta; das xcode-27-Image
      # bringt es nicht mit ("Bad CPU type in executable" bei sandbox-exec und swift-plugin-server)
      - name: Rosetta installieren
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license

      # Pakete VOR dem CodeQL-Init aufloesen: der CodeQL-Tracer injiziert sich sonst in
      # SwiftPMs sandbox-exec (Manifest-Laden) und scheitert mit "Bad CPU type in executable"
      - name: Swift-Pakete aufloesen
        run: |
          # Manifest-Sandbox aus: der CodeQL-Tracer kann sich nicht in /usr/bin/sandbox-exec
          # injizieren ("Bad CPU type in executable"), auch nicht beim Build selbst
          defaults write com.apple.dt.Xcode IDEPackageSupportDisableManifestSandbox -bool YES
          defaults write com.apple.dt.Xcode IDEPackageSupportDisablePluginExecutionSandbox -bool YES
          xcodebuild -resolvePackageDependencies \
            -project ntfy-ios.xcodeproj \
            -scheme ntfy \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      # GoogleService-Info.plist ist bewusst nicht im Repo (enthaelt API-Keys).
      # Fuer die reine Quelltext-Analyse genuegt ein Platzhalter ohne echte Werte —
      # die Datei muss nur existieren, damit der Resource-Build-Step durchlaeuft.
      - name: Platzhalter fuer GoogleService-Info.plist
        run: |
          cat > ntfy/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key><string>ci-placeholder</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>BUNDLE_ID</key><string>de.godsapp.ntfy</string>
            <key>PROJECT_ID</key><string>ci-placeholder</string>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><false/>
            <key>IS_GCM_ENABLED</key><true/>
            <key>IS_SIGNIN_ENABLED</key><false/>
          </dict>
          </plist>
          PLIST

      - name: Build
        run: |
          xcodebuild build \
            -project ntfy-ios.xcodeproj \
            -scheme ntfy \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
