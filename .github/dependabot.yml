version: 2
updates:
  # GitHub Actions (CodeQL-Workflow)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Swift Package Manager (Firebase) ueber die eingecheckte Package.resolved
  # des Xcode-Projekts
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
